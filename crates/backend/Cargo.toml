[package]
name = "go-news-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.9.0"
actix-rt = { version = "2.11", features = ["net", "signal"] }
chrono = "0.4.42"
env_logger = "0.11.8"
go-news-shared = { path = "../shared", features = ["sqlx"] }
log = "0.4.28"
reqwest = "0.12.24"
rss = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "1.1.6"

[package]
name = "go-news-shared"
version = "0.1.0"
edition = "2024"

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
chrono = "0.4.42"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.3", default-features = false, features = ["sqlite"], optional = true }
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.145"
